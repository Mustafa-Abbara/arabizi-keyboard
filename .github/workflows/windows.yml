# The Windows keyboard: the core's tests on Windows, then the package (HarfiTIP.dll, HarfiCoreC.dll, harfi-engine.exe,
# llama.cpp, the Swift runtime, rules, settings and install.ps1; the model is downloaded by install.ps1). Called by
# ci.yml on every pull request and on main (the package as the harfi-windows artifact), and by release.yml for a
# version tag (the package as Harfi-Windows-x64.zip on that release, with its line in SHA256SUMS).
name: windows

on:
  workflow_call:
    inputs:
      release:
        description: "The release (version tag) to add Harfi-Windows-x64.zip to; empty for none."
        type: string
        default: ""

jobs:
  windows:
    name: "windows (ArabiziCore tests, ADR 0032)"
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false  # the tests compare text written on Unix
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift --version
      # The runner's Visual Studio is newer than the clang in Swift's Windows toolchain expects.
      - run: swift test --package-path Packages/ArabiziCore -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      - name: the Windows keyboard (HarfiTIP.dll) and the core as a C library (HarfiCoreC.dll)
        shell: pwsh
        run: |
          swift build -c release --package-path Packages/ArabiziCore --product HarfiCoreC -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
          cmake -S Apps/HarfiWindows -B build/windows -A x64
          cmake --build build/windows --config Release
          New-Item -ItemType Directory -Force dist/harfi-windows/rules | Out-Null
          Copy-Item build/windows/Release/HarfiTIP.dll dist/harfi-windows/
          # The release build: `swift test` above leaves a debug HarfiCoreC.dll under .build too.
          $bin = swift build -c release --package-path Packages/ArabiziCore --show-bin-path
          Copy-Item "$bin/HarfiCoreC.dll" dist/harfi-windows/
          # The user's learned words, until a settings window exists (ADR 0033).
          swift build -c release --package-path Packages/ArabiziCore --product harfi-words -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
          Copy-Item "$bin/harfi-words.exe" dist/harfi-windows/
          Copy-Item data/rules/arabizi_to_arabic.json, data/rules/arabizi_lexicon.json, data/rules/spelling_options.json, data/rules/english_stopwords.json, data/rules/chat_abbreviations.json dist/harfi-windows/rules/
          Copy-Item Apps/HarfiWindows/install.ps1, Apps/HarfiWindows/status.ps1 dist/harfi-windows/
          New-Item -ItemType Directory -Force dist/harfi-windows/fonts | Out-Null
          Copy-Item Apps/ArabiziIME/Resources/Fonts/NotoNaskhArabic-Variable.ttf, Apps/ArabiziIME/Resources/Fonts/OFL.txt dist/harfi-windows/fonts/
          # The Swift runtime HarfiCoreC.dll needs, so the PC does not need a Swift toolchain.
          $runtime = Get-ChildItem "$env:LOCALAPPDATA/Programs/Swift/Runtimes" -Directory | Sort-Object Name | Select-Object -Last 1
          Copy-Item "$($runtime.FullName)/usr/bin/*.dll" dist/harfi-windows/
      # llama.cpp at the release the Mac pins (Packages/ArabiziLLM/Package.swift), built from source: its Windows
      # releases have no import libraries or headers. CPU only. Checked out by commit, not by tag (a tag can be moved
      # upstream); the commit is the one tag b11429 named on 7 Nov 2026. Cached by commit.
      - uses: actions/cache@v4
        id: llama
        with:
          path: build/llama.cpp
          key: llama-cpp-d81235049384534c167caea52b85a694f6103d14-windows-cpu
      - name: llama.cpp b11429
        if: steps.llama.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git init -q build/llama.cpp
          git -C build/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          $commit = 'd81235049384534c167caea52b85a694f6103d14'
          git -C build/llama.cpp fetch -q --depth 1 origin $commit
          git -C build/llama.cpp checkout -q FETCH_HEAD
          $got = git -C build/llama.cpp rev-parse HEAD
          if ($got -ne $commit) { throw "llama.cpp is at $got, expected $commit" }
          cmake -S build/llama.cpp -B build/llama.cpp/build -A x64 -DBUILD_SHARED_LIBS=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON
          cmake --build build/llama.cpp/build --config Release --target llama
      - name: the engine (harfi-engine.exe, the model runner as its own process)
        shell: pwsh
        run: |
          swift build -c release --package-path Packages/ArabiziEngine --product harfi-engine -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
          $bin = swift build -c release --package-path Packages/ArabiziEngine --show-bin-path
          Copy-Item "$bin/harfi-engine.exe" dist/harfi-windows/
          Copy-Item build/llama.cpp/build/bin/Release/llama.dll, build/llama.cpp/build/bin/Release/ggml.dll, build/llama.cpp/build/bin/Release/ggml-base.dll, build/llama.cpp/build/bin/Release/ggml-cpu.dll dist/harfi-windows/
          # The engine's settings; the model itself is downloaded by install.ps1 (808 MB, from the model release).
          New-Item -ItemType Directory -Force dist/harfi-windows/config | Out-Null
          Copy-Item config/engine.json, config/models.json dist/harfi-windows/config/
          Get-ChildItem dist/harfi-windows | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: harfi-windows
          path: dist/harfi-windows
      - name: add the package to the release
        if: inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          Compress-Archive -Path dist/harfi-windows/* -DestinationPath dist/Harfi-Windows-x64.zip
          # The Mac's release job made SHA256SUMS; the Windows zip gets its line in it.
          gh release download $env:RELEASE --pattern SHA256SUMS --dir dist/sums
          $hash = (Get-FileHash dist/Harfi-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::AppendAllText((Resolve-Path dist/sums/SHA256SUMS), "$hash  Harfi-Windows-x64.zip`n")  # LF, as on the Mac
          gh release upload $env:RELEASE dist/Harfi-Windows-x64.zip dist/sums/SHA256SUMS --clobber
