[project]
name = "arabizi-eval"
version = "0.1.0"
description = "Data tools and evaluation harness for the Arabizi keyboard (roadmap P2-P3)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
pairs = "arabizi_eval.pairs_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arabizi_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
