<!doctype html>
<!-- The link preview image (site/og.png, 1200x630): rendered by scripts/site/make_images.ps1. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Naskh"; src: url("../../site/fonts/NotoNaskhArabic-Variable.ttf"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F6F3EC; color: #1E2A25; font-family: "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; gap: 60px; padding: 0 80px; box-sizing: border-box; }

  .tag { font-size: 40px; font-weight: 600; margin: 6px 0 30px; letter-spacing: -.01em; }
  .demo { display: inline-flex; align-items: center; gap: 18px; white-space: nowrap; background: #fff; border: 2px solid #E4DFD4; border-radius: 22px; padding: 16px 28px; }

  .demo .arrow { color: #2F6B5A; font-size: 34px; }
  .demo .ar { font-family: "Naskh"; font-size: 40px; color: #2F6B5A; direction: rtl; line-height: 1.2; }
